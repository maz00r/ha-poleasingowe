configuration:
  db_host:
    name: Host bazy
    description: >-
      Nazwa hosta dodatku PostgreSQL widziana z innych dodatkow.
      Domyslnie db21ed7f-postgres-latest.
  db_port:
    name: Port bazy
    description: Port serwera PostgreSQL. Zwykle 5432.
  db_name:
    name: Nazwa bazy
    description: >-
      Baza uzywana przez ten dodatek. Add-on NIGDY nie tworzy ani nie usuwa
      baz — musi juz istniec.
  db_user:
    name: Uzytkownik bazy
    description: >-
      Rola aplikacji. Nigdy superuzytkownik: add-on laczy sie wylacznie jako
      wlasciciel swojej bazy.
  db_password:
    name: Haslo
    description: Haslo roli aplikacji. Nie pojawia sie w logach ani w zrzutach.
  grafana_base_url:
    name: Adres Grafany
    description: >-
      Uzywany tylko do budowania linkow do dashboardow. Puste = brak linkow.
  ai_provider:
    name: Dostawca wyceny AI
    description: >-
      Kto liczy wycene. `zgodny_z_openai` obejmuje DeepSeek, OpenRouter,
      Groq, Mistral i modele lokalne (Ollama, LM Studio) — czyli wszystko,
      co wystawia /chat/completions. Wymaga wtedy adresu i nazwy modelu.
  ai_api_key:
    name: Klucz API dostawcy
    description: >-
      Opcjonalny. Wlacza wycene AI na karcie pojazdu. Klucz nie jest
      wyswietlany ani zapisywany w logach.
  ai_base_url:
    name: Adres API dostawcy
    description: >-
      Wymagany dla `zgodny_z_openai`, np. https://api.deepseek.com/v1 albo
      http://ollama:11434/v1. Dla OpenAI i Anthropic zostaw puste.
  ai_model:
    name: Model wyceny AI
    description: >-
      Nazwa modelu u wybranego dostawcy, np. deepseek-chat. Puste = model
      domyslny dostawcy; przy `zgodny_z_openai` trzeba go podac.
  openai_api_key:
    name: Klucz API OpenAI (stara nazwa)
    description: >-
      Poprzednia nazwa opcji `ai_api_key`. Dziala nadal, zeby aktualizacja
      dodatku nie wylaczyla wyceny. W nowych konfiguracjach uzywaj
      `ai_api_key`.
  credentials:
    name: Poswiadczenia do serwisow
    description: >-
      Login i haslo do serwisow wymagajacych zalogowania. Po trzech nieudanych
      probach zrodlo blokuje sie i wymaga recznego resetu — czesc serwisow
      blokuje konto po kilku probach.
  sources:
    name: Zrodla
    description: >-
      Wlaczanie i wylaczanie serwisow oraz ich limity tempa. Floor to dolna
      granica odstepu miedzy odpytami w koncowce aukcji.
  log_level:
    name: Poziom logow
    description: Domyslnie INFO. DEBUG tylko na czas diagnozy.
  debug_dumps:
    name: Zrzuty diagnostyczne
    description: >-
      Zapisuje HTML przy bledzie parsowania. Domyslnie wylaczone. Zrzuty
      przechodza przez filtr redakcji, ale i tak trzymaj to wylaczone
      na co dzien.
  notify_on_critical:
    name: Powiadomienia krytyczne
    description: >-
      Powiadomienie w Home Assistant przy zablokowaniu logowania, otwarciu
      bezpiecznika zrodla albo braku bazy dluzszym niz 10 minut.
network: {}
