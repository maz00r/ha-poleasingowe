configuration:
  db_host:
    name: Database host
    description: >-
      Hostname of the PostgreSQL add-on as seen from other add-ons.
      Defaults to db21ed7f-postgres-latest.
  db_port:
    name: Database port
    description: PostgreSQL server port. Usually 5432.
  db_name:
    name: Database name
    description: >-
      Database used by this add-on. The add-on NEVER creates or drops
      databases — it must already exist.
  db_user:
    name: Database user
    description: >-
      Application role. Never a superuser: the add-on connects only as the
      owner of its own database.
  db_password:
    name: Password
    description: Application role password. Never appears in logs or dumps.
  grafana_base_url:
    name: Grafana base URL
    description: Used only to build dashboard links. Empty disables the links.
  ai_provider:
    name: AI valuation provider
    description: >-
      Who computes the valuation. `zgodny_z_openai` covers DeepSeek,
      OpenRouter, Groq, Mistral and local models (Ollama, LM Studio) —
      anything exposing /chat/completions. It then needs a base URL and
      a model name.
  ai_api_key:
    name: Provider API key
    description: >-
      Optional. Enables AI valuation on vehicle detail pages. The key is never
      displayed or written to logs.
  ai_base_url:
    name: Provider API base URL
    description: >-
      Required for `zgodny_z_openai`, e.g. https://api.deepseek.com/v1 or
      http://ollama:11434/v1. Leave empty for OpenAI and Anthropic.
  ai_model:
    name: AI valuation model
    description: >-
      Model name at the chosen provider, e.g. deepseek-chat. Empty = the
      provider default; `zgodny_z_openai` requires it.
  openai_api_key:
    name: OpenAI API key (legacy name)
    description: >-
      Previous name of `ai_api_key`. Still works so that updating the add-on
      does not switch valuation off. Use `ai_api_key` in new setups.
  credentials:
    name: Site credentials
    description: >-
      Login and password for sites that require signing in. After three failed
      attempts the source locks itself and needs a manual reset — some sites
      lock the account after a few tries.
  sources:
    name: Sources
    description: >-
      Enable or disable sites and set their rate limits. Floor is the lower
      bound on the interval between polls during an auction endgame.
  log_level:
    name: Log level
    description: Defaults to INFO. Use DEBUG only while diagnosing.
  debug_dumps:
    name: Debug dumps
    description: >-
      Saves HTML on parse errors. Off by default. Dumps go through the
      redaction filter, but keep this off day to day anyway.
  notify_on_critical:
    name: Critical notifications
    description: >-
      Home Assistant notification when a login locks, a source circuit breaker
      opens, or the database is unreachable for more than 10 minutes.
network: {}
