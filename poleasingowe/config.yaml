# Konfiguracja add-onu (SPEC.md §7.1).
name: Aukcje poleasingowe
version: "0.15.1"
slug: poleasingowe
description: >-
  Zbiera oferty z polskich serwisow aukcji samochodow poleasingowych,
  trzyma pelna historie cen i udostepnia interfejs operacyjny przez Ingress.
  Wylacznie do odczytu — nigdy nie licytuje ani nie sklada ofert.
url: https://github.com/maz00r/ha-poleasingowe

# Maszyna docelowa to amd64 (HAOS na Proxmoksie, SPEC.md §1).
arch:
  - amd64

# Ingress zapewnia uwierzytelnienie HA — nie dokladamy wlasnego logowania.
# `ports` celowo puste: nic nie publikujemy na zewnatrz (SPEC.md §7.1).
ingress: true
ingress_port: 8099
panel_icon: mdi:car-search
panel_title: Poleasingowe
init: false

# Eksporty CSV/XLSX i backup pg_dump ida do /share (SPEC.md §7.1, §12).
map:
  - share:rw

# Wylacznie do persistent_notification przy stanie krytycznym (SPEC.md §7.1).
# Domyslnie WYLACZONE — to nie jest encja, to alarm operacyjny.
homeassistant_api: false

# BOOLEAN, nie nazwa profilu — Supervisor odrzuca lancuch znakow:
# "expected boolean for dictionary value @ data['apparmor']". Profil wlasny
# bierze sie z pliku `apparmor.txt` obok tego config.yaml, a nazwa profilu
# W SRODKU pliku musi rownac sie slugowi dodatku (`poleasingowe`).
apparmor: true

options:
  db_host: db21ed7f-postgres-latest
  db_port: 5432
  db_name: poleasingowe
  db_user: poleasingowe_app
  db_password: ""
  grafana_base_url: ""
  # Wycena AI jest opcjonalna: bez klucza karta aukcji po prostu jej nie ma.
  # `ai_provider` decyduje, dokad ida dane pojazdu — `zgodny_z_openai`
  # z adresem lokalnym (np. http://ollama:11434/v1) nie wypuszcza ich z domu.
  ai_provider: openai
  ai_api_key: ""
  ai_base_url: ""
  ai_model: ""
  openai_api_key: ""
  credentials: []
  sources: []
  log_level: INFO
  debug_dumps: false
  notify_on_critical: false

schema:
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
  grafana_base_url: str?
  ai_provider: list(openai|anthropic|zgodny_z_openai)
  ai_api_key: password?
  ai_base_url: str?
  ai_model: str?
  # Poprzednia nazwa `ai_api_key`; zostaje, zeby aktualizacja nie wylaczyla
  # wyceny osobom, ktore maja ja juz ustawiona.
  openai_api_key: password?
  credentials:
    - source: str
      username: str
      password: password
  sources:
    - key: str
      enabled: bool?
      rate_limit_per_minute: int(1,600)?
      floor_seconds: int(10,86400)?
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  debug_dumps: bool
  notify_on_critical: bool
