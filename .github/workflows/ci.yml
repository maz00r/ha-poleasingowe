name: CI

on:
  push:
    branches: [main]
  pull_request:

# SPEC.md §7: add-on celuje w obraz ghcr.io/home-assistant/amd64-base-python:3.12-alpine,
# wiec CI chodzi na 3.12 nawet jesli deweloperka lokalnie idzie na nowszym Pythonie.
env:
  PYTHON_VERSION: "3.12"

jobs:
  jakosc:
    name: ruff / mypy / import-linter / pytest
    runs-on: ubuntu-latest

    # SPEC.md §13 — testy repozytoriow chodza na PostgreSQL 17 i tworza wlasne
    # bazy tymczasowe. W CI to kontener uslugowy, nigdy zadna realna instancja.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: poleasingowe_app
          POSTGRES_PASSWORD: poleasingowe_test
          POSTGRES_DB: postgres
          # Ten sam locale i encoding co na serwerze docelowym (SPEC.md §0),
          # zeby sortowanie zachowywalo sie w testach jak na produkcji.
          POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8 --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poleasingowe_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POLEASINGOWE_TEST_HOST: localhost
      POLEASINGOWE_TEST_USER: poleasingowe_app
      POLEASINGOWE_TEST_PASSWORD: poleasingowe_test

    steps:
      - uses: actions/checkout@v4

      - name: Zainstaluj uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Srodowisko
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: ruff (lint)
        run: .venv/bin/ruff check .

      - name: ruff (format)
        run: .venv/bin/ruff format --check .

      - name: mypy --strict
        run: .venv/bin/mypy

      - name: import-linter — kontrakt warstw
        # SPEC.md §6.1: naruszenie warstwy wywala build. To jedyny mechanizm,
        # ktory realnie powstrzymuje rozjazd architektury.
        run: .venv/bin/lint-imports

      - name: Rola aplikacji moze tworzyc bazy tymczasowe
        # Na produkcji tego uprawnienia NIE MA — tam baza jest tworzona recznie,
        # a add-on nigdy nie tworzy ani nie usuwa baz (SPEC.md §2 pkt 1).
        # Tutaj jest potrzebne wylacznie testom.
        env:
          PGPASSWORD: poleasingowe_test
        run: |
          psql -h localhost -U poleasingowe_app -d postgres \
            -c "ALTER ROLE poleasingowe_app CREATEDB"

      - name: pytest
        run: .venv/bin/pytest

      - name: Testy integracyjne faktycznie sie wykonaly
        # Fixture pomija je po cichu, gdy nie ma bazy. W CI brak bazy to blad,
        # a nie powod do zielonego builda.
        run: |
          .venv/bin/pytest poleasingowe/tests/integration -q \
            | tee /tmp/wynik.txt
          if grep -q "skipped" /tmp/wynik.txt; then
            echo "STOP: testy integracyjne zostaly pominiete — brak bazy w CI"
            exit 1
          fi

  dane-osobowe:
    name: brak fixtures z sesji zalogowanej
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zaden plik *-auth-* nie moze byc w repo
        # SPEC.md §10.2: strony po zalogowaniu zawieraja dane osobowe
        # wlasciciela. .gitignore je wyklucza, ale regula moze zostac
        # obeszla przez `git add -f` — to jest siatka bezpieczenstwa.
        run: |
          znalezione=$(git ls-files | grep -- '-auth-' || true)
          if [ -n "$znalezione" ]; then
            echo "STOP: w repo sa fixtures z sesji zalogowanej:"
            echo "$znalezione"
            exit 1
          fi
          echo "OK — brak plikow -auth-"
