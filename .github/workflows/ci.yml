name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# SPEC.md §7: add-on celuje w obraz ghcr.io/home-assistant/amd64-base-python:3.12-alpine,
# wiec CI chodzi na 3.12 nawet jesli deweloperka lokalnie idzie na nowszym Pythonie.
env:
  PYTHON_VERSION: "3.12"

jobs:
  jakosc:
    name: ruff / mypy / import-linter / pytest
    runs-on: ubuntu-latest

    # SPEC.md §13 — testy repozytoriow chodza na PostgreSQL 17 i tworza wlasne
    # bazy tymczasowe. W CI to kontener uslugowy, nigdy zadna realna instancja.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: poleasingowe_app
          POSTGRES_PASSWORD: poleasingowe_test
          POSTGRES_DB: postgres
          # Ten sam locale i encoding co na serwerze docelowym (SPEC.md §0),
          # zeby sortowanie zachowywalo sie w testach jak na produkcji.
          POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8 --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poleasingowe_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POLEASINGOWE_TEST_HOST: localhost
      POLEASINGOWE_TEST_USER: poleasingowe_app
      POLEASINGOWE_TEST_PASSWORD: poleasingowe_test

    steps:
      - uses: actions/checkout@v4

      - name: Zainstaluj uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Domyslnie setup-uv liczy klucz cache z uv.lock, ktorego nie mamy —
          # zaleznosci sa przypiete wprost w pyproject i w requirements.txt.
          # Bez tego kroku akcja wywala sie z "No file matched to [**/uv.lock]".
          cache-dependency-glob: |
            pyproject.toml
            poleasingowe/requirements.txt

      - name: Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Srodowisko
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: ruff (lint)
        run: .venv/bin/ruff check .

      - name: ruff (format)
        run: .venv/bin/ruff format --check .

      - name: mypy --strict
        run: .venv/bin/mypy

      - name: import-linter — kontrakt warstw
        # SPEC.md §6.1: naruszenie warstwy wywala build. To jedyny mechanizm,
        # ktory realnie powstrzymuje rozjazd architektury.
        run: .venv/bin/lint-imports

      - name: Rola aplikacji moze tworzyc bazy tymczasowe
        # Na produkcji tego uprawnienia NIE MA — tam baza jest tworzona recznie,
        # a add-on nigdy nie tworzy ani nie usuwa baz (SPEC.md §2 pkt 1).
        # Tutaj jest potrzebne wylacznie testom.
        env:
          PGPASSWORD: poleasingowe_test
        run: |
          psql -h localhost -U poleasingowe_app -d postgres \
            -c "ALTER ROLE poleasingowe_app CREATEDB"
          # Migracja 002 nadaje grafana_ro dostep do widokow (SPEC.md §9)
          # i bez tej roli wywala sie glosno. Na serwerze docelowym rola
          # istnieje (§0); w CI trzeba ja utworzyc.
          psql -h localhost -U poleasingowe_app -d postgres -c \
            "DO \$\$ BEGIN
               IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='grafana_ro')
               THEN CREATE ROLE grafana_ro LOGIN PASSWORD 'poleasingowe_test';
               END IF;
             END \$\$;"

      - name: PostgreSQL 17 client (pg_dump musi odpowiadac wersji serwera)
        # `ubuntu-latest` ma w PATH domyslnie postgresql-client-16 (usluga
        # postgres tuz wyzej to serwer 17), a pg_dump ODMAWIA zrzutu z
        # nowszego serwera niz on sam — dokladnie ten sam wymog, co w
        # app/infrastructure/kopia.py i w Dockerfile (SPEC.md §7.1).
        # Bez tego test_kopia.py pada na kazdym przebiegu:
        #   "pg_dump: error: aborting because of server version mismatch"
        #
        # PIERWSZA PROBA (`apt-get install postgresql-client-17` bez
        # dodania repo) wywalila sie exit 100 — PGDG NIE jest domyslnie
        # skonfigurowane na runnerze, mimo ze sufiks "pgdg24.04" w wersji
        # domyslnego klienta 16 tak sugerowal. `postgresql-common` niesie
        # oficjalny skrypt PGDG (apt.postgresql.org.sh), ktory sam dodaje
        # klucz i zrodlo — bez recznej gimnastyki z apt-key.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: pytest
        run: .venv/bin/pytest

      - name: Testy integracyjne faktycznie sie wykonaly
        # Fixture pomija je po cichu, gdy nie ma bazy. W CI brak bazy to blad,
        # a nie powod do zielonego builda.
        run: |
          .venv/bin/pytest poleasingowe/tests/integration -q \
            | tee /tmp/wynik.txt
          if grep -q "skipped" /tmp/wynik.txt; then
            echo "STOP: testy integracyjne zostaly pominiete — brak bazy w CI"
            exit 1
          fi

  dane-osobowe:
    name: brak fixtures z sesji zalogowanej
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zaden plik *-auth-* nie moze byc w repo
        # SPEC.md §10.2: strony po zalogowaniu zawieraja dane osobowe
        # wlasciciela. .gitignore je wyklucza, ale regula moze zostac
        # obeszla przez `git add -f` — to jest siatka bezpieczenstwa.
        run: |
          znalezione=$(git ls-files | grep -- '-auth-' || true)
          if [ -n "$znalezione" ]; then
            echo "STOP: w repo sa fixtures z sesji zalogowanej:"
            echo "$znalezione"
            exit 1
          fi
          echo "OK — brak plikow -auth-"

  pakowanie-proxmox:
    name: obraz / compose / PostgreSQL standalone
    runs-on: ubuntu-latest
    env:
      POLEASINGOWE_VERSION: ci
      APP_BIND_IP: 127.0.0.1
      POSTGRES_DATA_DIR: /tmp/poleasingowe-ci/postgres
      APP_DATA_DIR: /tmp/poleasingowe-ci/data
      APP_SHARE_DIR: /tmp/poleasingowe-ci/share
      OPTIONS_FILE: /tmp/poleasingowe-ci/options.json
      POSTGRES_ADMIN_PASSWORD_FILE: /tmp/poleasingowe-ci/secrets/postgres
      POLEASINGOWE_APP_PASSWORD_FILE: /tmp/poleasingowe-ci/secrets/app
      GRAFANA_RO_PASSWORD_FILE: /tmp/poleasingowe-ci/secrets/grafana
    steps:
      - uses: actions/checkout@v4

      - name: Obraz standalone
        run: >-
          docker build
          --build-arg APP_VERSION=ci
          --build-arg VCS_REF=${{ github.sha }}
          --tag ghcr.io/maz00r/poleasingowe:ci
          --file deploy/proxmox/Dockerfile .

      - name: Konfiguracja testowego stosu
        run: |
          install -d -m 700 /tmp/poleasingowe-ci/secrets
          printf '%s\n' postgres-ci > /tmp/poleasingowe-ci/secrets/postgres
          printf '%s\n' app-ci > /tmp/poleasingowe-ci/secrets/app
          printf '%s\n' grafana-ci > /tmp/poleasingowe-ci/secrets/grafana
          cp deploy/proxmox/options.example.json /tmp/poleasingowe-ci/options.json
          chmod 600 /tmp/poleasingowe-ci/secrets/* \
            /tmp/poleasingowe-ci/options.json
          sudo install -d -o 10001 -g 10001 \
            /tmp/poleasingowe-ci/data /tmp/poleasingowe-ci/share
          sudo install -d /tmp/poleasingowe-ci/postgres
          sudo chown 10001:10001 \
            /tmp/poleasingowe-ci/options.json \
            /tmp/poleasingowe-ci/secrets/app
          cd deploy/proxmox
          docker compose config --quiet

      - name: Smoke test stosu
        working-directory: deploy/proxmox
        run: |
          docker compose up -d
          for proba in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8099/zdrowie >/dev/null; then
              break
            fi
            if [ "$proba" -eq 60 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          test "$(docker compose exec -T app id -u)" = 10001
          uprawnienia=$(docker compose exec -T postgres psql \
            -U postgres -d postgres -Atc \
            "SELECT rolsuper || '|' || rolcreatedb || '|' || rolcreaterole \
             FROM pg_roles WHERE rolname='poleasingowe_app'")
          test "$uprawnienia" = "false|false|false"
          docker compose exec -T postgres psql -U postgres -d poleasingowe \
            -c "INSERT INTO app.source (key, name) VALUES ('ci-persist', 'CI')"
          docker compose restart app
          for proba in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8099/zdrowie \
              | grep -q '"dostepna":true'; then
              break
            fi
            sleep 2
          done
          rekordy=$(docker compose exec -T postgres psql \
            -U postgres -d poleasingowe -Atc \
            "SELECT count(*) FROM app.source WHERE key='ci-persist'")
          test "$rekordy" = 1
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 \
            -U postgres -d poleasingowe \
            -c "SET ROLE grafana_ro; SELECT count(*) FROM reporting.v_source_health"
          if docker compose exec -T postgres psql -v ON_ERROR_STOP=1 \
            -U postgres -d poleasingowe \
            -c "SET ROLE grafana_ro; SELECT count(*) FROM app.source"; then
            echo "grafana_ro nie może czytać app.source"
            exit 1
          fi

      - name: Eksport i odtworzenie pakietu
        working-directory: deploy/proxmox
        run: |
          curl --fail --silent --output /dev/null --request POST \
            http://127.0.0.1:8099/diagnostyka/eksport-migracji
          for proba in $(seq 1 60); do
            pakiet=$(find /tmp/poleasingowe-ci/share/poleasingowe/migracja \
              -name 'poleasingowe-migracja-*.tar' -print -quit 2>/dev/null || true)
            if [ -n "$pakiet" ]; then
              break
            fi
            if [ "$proba" -eq 60 ]; then
              echo "Pakiet migracyjny nie powstał"
              exit 1
            fi
            sleep 2
          done
          docker compose stop app
          ./scripts/restore-package.sh --replace "$pakiet"
          docker compose up -d app
          rekordy=$(docker compose exec -T postgres psql \
            -U postgres -d poleasingowe -Atc \
            "SELECT count(*) FROM app.source WHERE key='ci-persist'")
          test "$rekordy" = 1

      - name: Logi po błędzie
        if: failure()
        working-directory: deploy/proxmox
        run: docker compose logs

      - name: Zatrzymanie stosu
        if: always()
        working-directory: deploy/proxmox
        run: docker compose down

  publikacja-obrazu:
    name: publikacja GHCR
    if: github.event_name == 'push'
    needs: [jakosc, dane-osobowe, pakowanie-proxmox]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Wersja tagu zgadza się z wydaniem HA
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          wersja=${GITHUB_REF_NAME#v}
          test "$(sed -n 's/^version: "\([^"]*\)"/\1/p' poleasingowe/config.yaml)" = "$wersja"
          test "$(sed -n 's/^WERSJA = "\([^"]*\)"/\1/p' poleasingowe/app/wersja.py)" = "$wersja"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Tagi obrazu
        id: tagi
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            wersja=${GITHUB_REF_NAME#v}
            {
              echo 'wartosci<<EOF'
              echo "ghcr.io/maz00r/poleasingowe:$wersja"
              echo 'ghcr.io/maz00r/poleasingowe:latest'
              echo 'EOF'
              echo "wersja=$wersja"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'wartosci<<EOF'
              echo 'ghcr.io/maz00r/poleasingowe:edge'
              echo 'EOF'
              echo 'wersja=edge'
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/proxmox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tagi.outputs.wartosci }}
          build-args: |
            APP_VERSION=${{ steps.tagi.outputs.wersja }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
