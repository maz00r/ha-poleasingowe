name: Deploy Proxmox

# Deploy wersji na Proxmoxa po SSH przez Cloudflare Tunnel
# (deploy/proxmox/README.md §6). Wywoływany z CI po tagu wydania albo ręcznie
# z zakładki Actions — np. żeby wrócić do poprzedniej wersji. Klucz po stronie
# LXC ma wymuszoną komendę `deploy-wersji.sh`, więc CI może wyłącznie wdrożyć
# wersję X.Y.Z. Bez skonfigurowanych sekretów deploy się pomija.

on:
  workflow_call:
    inputs:
      wersja:
        description: Wersja do wdrożenia (X.Y.Z albo vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      wersja:
        description: Wersja do wdrożenia (X.Y.Z albo vX.Y.Z) — obraz musi być w GHCR
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.wersja }}
    runs-on: ubuntu-latest
    environment: proxmox
    concurrency:
      group: deploy-proxmox
      cancel-in-progress: false
    env:
      CLOUDFLARED_VERSION: "2026.10.0"
      CLOUDFLARED_SHA256: d33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db
      WERSJA_WEJSCIE: ${{ inputs.wersja }}
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Wersja
        run: |
          wersja=${WERSJA_WEJSCIE#v}
          if ! printf '%s\n' "$wersja" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Zła wersja '$WERSJA_WEJSCIE' — oczekiwano X.Y.Z"
            exit 1
          fi
          echo "WERSJA=$wersja" >> "$GITHUB_ENV"

      - name: Konfiguracja obecna?
        id: konfiguracja
        run: |
          for zmienna in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_KEY \
            DEPLOY_KNOWN_HOSTS CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -z "$(printenv "$zmienna")" ]; then
              echo "::notice::Brak $zmienna — automatyczny deploy pominięty."
              echo "gotowe=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "gotowe=true" >> "$GITHUB_OUTPUT"

      - name: cloudflared
        if: steps.konfiguracja.outputs.gotowe == 'true'
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum --check
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Klucz i znane hosty
        if: steps.konfiguracja.outputs.gotowe == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<KONFIG
          Host deploy
            HostName ${DEPLOY_SSH_HOST}
            User ${DEPLOY_SSH_USER}
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${CF_ACCESS_CLIENT_ID} --service-token-secret ${CF_ACCESS_CLIENT_SECRET}
          KONFIG

      - name: Deploy wersji
        if: steps.konfiguracja.outputs.gotowe == 'true'
        run: ssh deploy "$WERSJA"

      - name: Sprzątanie klucza
        if: always()
        run: rm -f ~/.ssh/deploy ~/.ssh/config
