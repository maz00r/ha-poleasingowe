name: poleasingowe

services:
  postgres:
    image: postgres:17-bookworm
    entrypoint: ["/usr/local/bin/poleasingowe-entrypoint.sh"]
    command: ["postgres"]
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8 --encoding=UTF8"
      POLEASINGOWE_APP_PASSWORD_FILE: /run/secrets/poleasingowe_app_password
      GRAFANA_RO_PASSWORD_FILE: /run/secrets/grafana_ro_password
    secrets:
      - postgres_admin_password
      - poleasingowe_app_password
      - grafana_ro_password
    volumes:
      - ${POSTGRES_DATA_DIR:?Ustaw POSTGRES_DATA_DIR}:/var/lib/postgresql/data
      - ./postgres/entrypoint.sh:/usr/local/bin/poleasingowe-entrypoint.sh:ro
      - ./postgres/init-poleasingowe.sh:/docker-entrypoint-initdb.d/10-poleasingowe.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  app:
    image: ghcr.io/maz00r/poleasingowe:${POLEASINGOWE_VERSION:?Ustaw POLEASINGOWE_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLEASINGOWE_OPTIONS: /config/options.json
      POLEASINGOWE_DB_PASSWORD_FILE: /run/secrets/poleasingowe_app_password
    secrets:
      - poleasingowe_app_password
    volumes:
      - ${OPTIONS_FILE:?Ustaw OPTIONS_FILE}:/config/options.json:ro
      - ${APP_DATA_DIR:?Ustaw APP_DATA_DIR}:/data
      - ${APP_SHARE_DIR:?Ustaw APP_SHARE_DIR}:/share
    ports:
      - "${APP_BIND_IP:?Ustaw APP_BIND_IP}:8099:8099"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - ai

  # Wycena AI z subskrypcji Claude (README §7). Profil `ai`, bo usługa wymaga
  # tokenu: bez `--profile ai` nie wstaje ani tu, ani w CI. Aplikacja na nią
  # nie czeka — wycena jest dodatkiem, a nie warunkiem zbierania danych.
  claudebox:
    # Po digeście, nie `latest`: ten obraz dostaje token konta Claude.
    image: ghcr.io/armanjr/claudebox@sha256:ed9d7eed71e4798f3584a82656f4c7c5127633acceb824899d264acdfc863543
    profiles:
      - ai
    restart: unless-stopped
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDEBOX_API_KEY: ${CLAUDEBOX_API_KEY:-}
      OPENAI_COMPAT: "1"
      # Automat wycenia pojedynczo; drugie miejsce jest na kliknięcie na karcie.
      # Ponad limit claudebox odpowiada 429, a automat pauzuje wtedy na godzinę.
      MAX_CONCURRENT: "2"
    volumes:
      # Serwer uruchamia Claude'a z --dangerously-skip-permissions, a do
      # promptu trafiają cudze dokumenty aukcji. Wycenie narzędzia są zbędne.
      - ./claudebox/managed-settings.json:/etc/claude-code/managed-settings.json:ro
    # Docker na Linuksie pyta resolver z sieci kontenera, a firewall entrypointu
    # przepuszcza tylko 127.0.0.11 i bramę. Bez tej reguły DNS nie działa, choć
    # adresy Anthropic są wpuszczone. Entrypoint i tak potrzebuje 8.8.8.8 (`dig`).
    dns:
      - 8.8.8.8
    command:
      - sh
      - -c
      - >-
        sudo iptables -I OUTPUT 1 -d 8.8.8.8 -p udp --dport 53 -j ACCEPT &&
        exec node /opt/claudebox/server.js
    # Firewall wychodzący w entrypoincie. Nie zatrzymuje on startu, gdy reguły
    # się nie założą, dlatego ich obecność sprawdza healthcheck.
    cap_add:
      - NET_ADMIN
    # Jedna wycena to do ok. 600 MiB. Przy braku pamięci ma paść ona, nie baza.
    mem_limit: 1500m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          sudo -n iptables -S OUTPUT | grep -q -- '-A OUTPUT -j DROP' &&
          getent hosts api.anthropic.com > /dev/null &&
          node -e "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Bez portów i bez sieci `backend`: `/prompt` claudeboxa nie ma
    # uwierzytelnienia, więc dosięga go tylko aplikacja, a Postgresa on nie.
    networks:
      - ai

networks:
  backend:
  ai:

secrets:
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:?Ustaw POSTGRES_ADMIN_PASSWORD_FILE}
  poleasingowe_app_password:
    file: ${POLEASINGOWE_APP_PASSWORD_FILE:?Ustaw POLEASINGOWE_APP_PASSWORD_FILE}
  grafana_ro_password:
    file: ${GRAFANA_RO_PASSWORD_FILE:?Ustaw GRAFANA_RO_PASSWORD_FILE}
